# Tiling scheme for Speckle: MGRS cells.
scheme: mgrs
cell_size_m: 10000     # 100000 | 10000 | 1000. 10 km = ~1000 px at 10 m (GCOV), ~125 px at 80 m (GUNW)
max_area_tiles: 16     # most tiles one Range-box area scan may queue (each tile is a full scan; they run one after another)
margin_m: 300          # ring added around a tile when fetching, so edge filters/resampling have context
